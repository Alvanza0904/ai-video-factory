name: AI Video Factory - Multi-Clip Cloud Render

on:
  workflow_dispatch:
    inputs:
      source_urls:
        description: "One HTTPS URL per line (up to 10 source videos; smoke test only)"
        required: true
        type: string
      output_name:
        description: "Output filename without extension"
        required: false
        default: "ai-video-factory-output"
        type: string
      duration_seconds:
        description: "Target duration"
        required: false
        default: "45"
        type: choice
        options: ["30", "45", "60"]

permissions:
  contents: read

concurrency:
  group: ai-video-factory-render
  cancel-in-progress: false

jobs:
  render:
    name: Multi-clip FFmpeg render
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Render footage
        env:
          SOURCE_URLS: ${{ inputs.source_urls }}
          OUTPUT_NAME: ${{ inputs.output_name }}
          DURATION_SECONDS: ${{ inputs.duration_seconds }}
        run: python3 scripts/render_multi.py

      - name: Upload rendered MP4
        uses: actions/upload-artifact@v4
        with:
          name: ai-video-factory-multi-clip-render
          path: ${{ inputs.output_name }}.mp4
          if-no-files-found: error
          retention-days: 3
