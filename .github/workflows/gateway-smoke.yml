name: Workers Gateway Connectivity Check

on:
  push:
    paths:
      - ".github/workflows/gateway-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  gateway-health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Workers gateway from GitHub-hosted runner
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --max-time 20 https://avf-runner-gateway.freftialvanza0904.workers.dev/health)"
          echo "$response"
          echo "$response" | python -c "import json,sys; d=json.load(sys.stdin); assert d.get('ok') is True"
      - name: Obtain short-lived GitHub runner identity
        shell: bash
        run: |
          set -euo pipefail
          token="$(curl --fail --silent --show-error -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ai-video-factory" | python -c "import json,sys; print(json.load(sys.stdin)['value'])")"
          echo "OIDC_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Verify signed runner identity
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            "https://avf-runner-gateway.freftialvanza0904.workers.dev/auth-check?run_id=${GITHUB_RUN_ID}"
