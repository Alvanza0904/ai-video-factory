name: ReLink Vision Capability Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vision:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify Re:Link image understanding
        env:
          RELINK_API_KEY: ${{ secrets.RELINK_API_KEY }}
          RELINK_BASE_URL: https://api.relink-gateway.biz.id/v1
          RELINK_VISION_MODEL: deepseek-flash
        run: python3 scripts/relink_vision_smoke.py
