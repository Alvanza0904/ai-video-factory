name: Education Animation Engine Smoke Test

on:
  push:
    branches: [main]
    paths:
      - "scripts/education_animation.py"
      - ".github/workflows/education-render-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg and neural TTS
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install --only-binary=:all: pillow edge-tts
      - name: Generate a real Indonesian voice and animated MP4
        env:
          SMOKE_TEST: "1"
          EDGE_TTS_VOICE: id-ID-ArdiNeural
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: UFHqTMrq8xJwvZqvLPBv
          ELEVENLABS_MODEL_ID: eleven_multilingual_v2
        run: python3 scripts/education_animation.py
      - name: Upload sample video
        uses: actions/upload-artifact@v4
        with:
          name: education-animation-smoke-sample
          path: ai-video-factory-final.mp4
          retention-days: 3
