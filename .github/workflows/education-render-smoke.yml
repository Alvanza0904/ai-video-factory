name: Education Animation Engine Smoke Test

on:
  push:
    branches: [main]
    paths:
      - "scripts/education_animation.py"
      - ".github/workflows/education-render-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg and Piper
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install --only-binary=:all: pillow piper-tts
      - name: Download Indonesian voice model
        run: |
          mkdir -p models
          curl -fL --retry 3 "https://huggingface.co/rhasspy/piper-voices/resolve/main/id/id_ID/news_tts/medium/id_ID-news_tts-medium.onnx" -o models/id_ID-news_tts-medium.onnx
          curl -fL --retry 3 "https://huggingface.co/rhasspy/piper-voices/resolve/main/id/id_ID/news_tts/medium/id_ID-news_tts-medium.onnx.json" -o models/id_ID-news_tts-medium.onnx.json
      - name: Generate a real Indonesian voice and animated MP4
        env:
          SMOKE_TEST: "1"
          PIPER_MODEL: models/id_ID-news_tts-medium.onnx
        run: python3 scripts/education_animation.py
      - name: Upload sample video
        uses: actions/upload-artifact@v4
        with:
          name: education-animation-smoke-sample
          path: ai-video-factory-final.mp4
          retention-days: 3
