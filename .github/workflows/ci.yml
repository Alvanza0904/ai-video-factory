name: Validate AI Video Factory

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web-build:
    name: Next.js build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npx tsc --noEmit
      - name: Install FFmpeg for renderer smoke test
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install Python dependencies for animation tests
        run: python -m pip install --upgrade pip pillow
      - name: Validate Python render and AI worker syntax
        run: python3 -m py_compile scripts/*.py
      - name: Test animated education scene library
        run: python3 scripts/education_smoke_test.py
      - name: Test generated sound library and audio mixing
        run: python3 scripts/audio_smoke_test.py
      - name: Test multi-clip transition normalization
        run: python3 scripts/xfade_smoke_test.py
      - name: Build
        run: npm run build
