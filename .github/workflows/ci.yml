name: Validate Animated Video Studio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web-build:
    name: Next.js build and animation checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npx tsc --noEmit
      - name: Install Python dependencies for animation tests
        run: python -m pip install --upgrade pip pillow
      - name: Validate animation worker syntax
        run: python3 -m py_compile scripts/education_animation.py scripts/education_smoke_test.py scripts/report_failure.py
      - name: Test animated education scene library
        run: python3 scripts/education_smoke_test.py
      - name: Build
        run: npm run build
