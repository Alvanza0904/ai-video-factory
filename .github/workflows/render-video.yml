name: AI Video Factory - Cloud Render

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "HTTPS URL to a source video (temporary smoke test only)"
        required: true
        type: string
      output_name:
        description: "Output filename without extension"
        required: false
        default: "ai-video-factory-output"
        type: string
      duration_seconds:
        description: "Target duration (30-60 seconds)"
        required: false
        default: "45"
        type: choice
        options:
          - "30"
          - "45"
          - "60"

permissions:
  contents: read

concurrency:
  group: video-render-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    name: Render MP4 with FFmpeg
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate input
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          OUTPUT_NAME: ${{ inputs.output_name }}
        run: |
          python - <<'PY'
          import os, re, sys
          from urllib.parse import urlparse
          url = os.environ["SOURCE_URL"].strip()
          parsed = urlparse(url)
          if parsed.scheme != "https" or not parsed.netloc:
              sys.exit("Only valid HTTPS source URLs are accepted.")
          name = os.environ["OUTPUT_NAME"].strip()
          if not re.fullmatch(r"[A-Za-z0-9_-]{1,60}", name):
              sys.exit("Output name may contain only letters, numbers, _ and - (max 60 chars).")
          PY

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download source footage
        env:
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          curl --fail --location --silent --show-error \
            --max-time 300 --max-filesize 524288000 \
            "$SOURCE_URL" -o source-input
          test -s source-input
          ffprobe -v error -show_entries format=duration -of csv=p=0 source-input

      - name: Render vertical 1080p preview
        env:
          DURATION: ${{ inputs.duration_seconds }}
          OUTPUT_NAME: ${{ inputs.output_name }}
        run: |
          ffmpeg -hide_banner -y -i source-input \
            -t "$DURATION" \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1,fps=30" \
            -c:v libx264 -preset veryfast -crf 23 \
            -c:a aac -b:a 160k -ar 48000 \
            -movflags +faststart -pix_fmt yuv420p \
            "${OUTPUT_NAME}.mp4"
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height -of json "${OUTPUT_NAME}.mp4"

      - name: Upload rendered MP4
        uses: actions/upload-artifact@v4
        with:
          name: ai-video-factory-render
          path: ${{ inputs.output_name }}.mp4
          if-no-files-found: error
          retention-days: 3
