name: AI Video Factory - AI Director and Render

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Editing job UUID"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ai-video-factory-job-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  ai-edit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install FFmpeg and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install faster-whisper jsonschema
      - name: Analyze footage, create edit plan, and render
        env:
          JOB_ID: ${{ inputs.job_id }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_TOKEN: ${{ github.token }}
          MANIFEST_URL: https://avf-runner-gateway.freftialvanza0904.workers.dev/api/jobs/manifest
          DOWNLOAD_BASE_URL: https://avf-runner-gateway.freftialvanza0904.workers.dev/api/jobs/download
          OUTPUT_UPLOAD_BASE_URL: https://avf-runner-gateway.freftialvanza0904.workers.dev/api/jobs/output
          RELINK_API_KEY: ${{ secrets.RELINK_API_KEY }}
          RELINK_BASE_URL: https://api.relink-gateway.biz.id/v1
          RELINK_VISION_MODEL: deepseek-v4.1-flash
        run: python3 scripts/ai_edit.py
      - name: Report failure to dashboard
        if: failure()
        env:
          JOB_ID: ${{ inputs.job_id }}
          MANIFEST_JSON: ${{ inputs.manifest_json }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_TOKEN: ${{ github.token }}
          MANIFEST_URL: https://avf-runner-gateway.freftialvanza0904.workers.dev/api/jobs/manifest
          FAILURE_REPORT_URL: https://avf-runner-gateway.freftialvanza0904.workers.dev/api/jobs/failure
        run: python3 scripts/report_failure.py
      - name: Upload preview artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ai-video-factory-${{ inputs.job_id }}
          path: ai-video-factory-final.mp4
          if-no-files-found: error
          retention-days: 3
