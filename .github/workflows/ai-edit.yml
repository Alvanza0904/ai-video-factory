name: AI Video Factory - AI Director and Render
run-name: AI Edit - ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Editing job UUID"
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: ai-video-factory-job-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  ai-edit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Obtain short-lived GitHub runner identity
        shell: bash
        run: |
          set -euo pipefail
          token="$(curl --fail --silent --show-error -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ai-video-factory" | python -c "import json,sys; print(json.load(sys.stdin)['value'])")"
          echo "OIDC_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Install FFmpeg and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install --only-binary=:all: "av==18.1.0" "faster-whisper==1.2.1" jsonschema
      - name: Analyze footage, create edit plan, and render
        env:
          JOB_ID: ${{ inputs.job_id }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_TOKEN: ${{ github.token }}
          MANIFEST_URL: https://avf-runner.omodajaecoopalembang.web.id/api/jobs/manifest
          DOWNLOAD_BASE_URL: https://avf-runner.omodajaecoopalembang.web.id/api/jobs/download
          OUTPUT_UPLOAD_BASE_URL: https://avf-runner.omodajaecoopalembang.web.id/api/jobs/output
          RELINK_API_KEY: ${{ secrets.RELINK_API_KEY }}
          RELINK_BASE_URL: https://api.relink-gateway.biz.id/v1
          RELINK_VISION_MODEL: deepseek-v4.1-flash
        run: python3 scripts/ai_edit.py
      - name: Report failure to dashboard
        if: failure()
        env:
          JOB_ID: ${{ inputs.job_id }}
          MANIFEST_JSON: ${{ inputs.manifest_json }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_TOKEN: ${{ github.token }}
          MANIFEST_URL: https://avf-runner.omodajaecoopalembang.web.id/api/jobs/manifest
          FAILURE_REPORT_URL: https://avf-runner.omodajaecoopalembang.web.id/api/jobs/failure
        run: python3 scripts/report_failure.py
      - name: Upload preview artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ai-video-factory-${{ inputs.job_id }}
          path: ai-video-factory-final.mp4
          if-no-files-found: error
          retention-days: 3
